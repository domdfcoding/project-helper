[build-system]
requires = [ "whey",]
build-backend = "whey"

[project]
name = "project-helper"
version = "0.0.0"
description = "Configuration helper for CircuitPython projects."
readme = "README.rst"
keywords = [ "configuration",]
dynamic = [ "requires-python", "classifiers", "dependencies",]

[project.license]
file = "LICENSE"

[[project.authors]]
name = "Dominic Davis-Foster"
email = "dominic@davis-foster.co.uk"

[project.urls]
Homepage = "https://github.com/domdfcoding/project-helper"
"Issue Tracker" = "https://github.com/domdfcoding/project-helper/issues"
"Source Code" = "https://github.com/domdfcoding/project-helper"

[project.scripts]
project_helper = "project_helper.__main__:main"
project-helper = "project_helper.__main__:main"

[tool.whey]
base-classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Typing :: Typed",
]
python-versions = [ "3.1", "3.8", "3.9",]
python-implementations = [ "CPython",]
platforms = [ "Windows", "macOS", "Linux",]
license-key = "MIT"
package = "project_helper"
additional-files = [
    "include project_helper/testing/project_helper_example.yml",
    "recursive-include project_helper/templates *",
    "include project_helper/project_helper_schema.json",
]

[tool.importcheck]

[tool.mypy]
python_version = "3.8"
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
incremental = false

[tool.snippet-fmt]
directives = [ "code-block",]

[tool.snippet-fmt.languages.python]
reformat = true

[tool.snippet-fmt.languages.TOML]
reformat = true

[tool.snippet-fmt.languages.ini]

[tool.snippet-fmt.languages.json]

[tool.dep_checker]
namespace_packages = [ "ruamel.yaml",]
allowed_unused = [ "idna",]

[tool.dep_checker.name_mapping]
attrs = "attr"
ruamel-yaml = "ruamel.yaml"

[tool.dependency-dash."requirements.txt"]
order = 10

[tool.dependency-dash."tests/requirements.txt"]
order = 20
include = false
